name: Build Windows Installer (Kairos Setup.exe)

on:
  push:
    branches: ["feature/offline-planning", "feature/planning-stability", "fix/security-hardening"]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'public/**'
      - 'scripts/windows-*.ps1'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'vite.config.ts'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read

jobs:
  build-windows-installer:
    name: Build Windows NSIS Setup.exe & MSI
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          cache: 'npm'

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup override set 1.100.0
      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck & Lint frontend
        run: npm run lint

      - name: Run unit test suite
        run: npm test

      - name: Build offline production frontend bundle (dist/)
        run: npm run build

      - name: Verify offline bundle integrity (dist/)
        run: npm exec --offline -- tsx --test src/utils/offlineBundleVerifier.test.ts

      - name: Test native database behavior
        run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml --lib

      - name: Build Tauri v2 Windows application and NSIS/MSI installers
        shell: pwsh
        run: |
          npm run desktop:build

      - name: Record provenance and check expected outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = New-Item -ItemType Directory windows-installer-artifacts
          $release = 'src-tauri/target/release'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $files = @("$release/kairos-desktop.exe", "$release/bundle/nsis/Kairos_${version}_x64-setup.exe", "$release/bundle/msi/Kairos_${version}_x64_en-US.msi")
          foreach ($file in $files) { Copy-Item -LiteralPath $file -Destination $outDir }
          Get-ChildItem $outDir -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName).Hash.ToLower())  $($_.Name)"
          } | Tee-Object -FilePath "$outDir/SHA256SUMS.txt"
          [ordered]@{commit=$env:GITHUB_SHA; parent=(git rev-parse HEAD^); version=$version; runner=$env:ImageVersion; node=(node -v); npm=(npm -v); rust=(rustc -V); cargo=(cargo -V); tauri=(npm exec --offline -- tauri --version); locks=@((Get-FileHash package-lock.json).Hash,(Get-FileHash src-tauri/Cargo.lock).Hash)} |
            ConvertTo-Json | Set-Content "$outDir/build.json"
      - name: Check new Windows binaries individually
        shell: pwsh
        run: ./scripts/windows-inspect.ps1 -Directory windows-installer-artifacts -Report windows-installer-artifacts/inspection.json

      - name: Upload Windows Installer Artifacts (Setup.exe, MSI, SHA256SUMS.txt)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kairos-windows-x64-installer
          path: |
            windows-installer-artifacts/*-setup.exe
            windows-installer-artifacts/*.msi
            windows-installer-artifacts/kairos-desktop.exe
            windows-installer-artifacts/SHA256SUMS.txt
            windows-installer-artifacts/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Check original artifact and exercise upgrade on the disposable runner
        if: github.ref == 'refs/heads/fix/security-hardening'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/windows-upgrade.ps1
      - name: Upload inspection and upgrade evidence
        if: always() && github.ref == 'refs/heads/fix/security-hardening'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kairos-windows-inspection
          path: windows-evidence/*.json
          if-no-files-found: warn
          retention-days: 30
