[package]
name = "kairos-desktop"
version = "2.2.2"
description = "کایروس — فضای کار شخصی و تمرکز عمیق (نسخه دسکتاپ ویندوز)"
authors = ["Kairos Workspace"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "kairos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
open = "5"
tauri = { version = "2.2.0", features = [] }
tauri-plugin-single-instance = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
