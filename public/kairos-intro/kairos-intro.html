<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>معرفی کایروس</title><link rel="stylesheet" href="kairos-intro.css"><script src="kairos-intro-host.js" defer></script><script src="kairos-intro-data.js" defer></script><script src="kairos-intro-art.js" defer></script><script src="kairos-intro.js" defer></script></head>
